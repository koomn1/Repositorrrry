name: Windows Remote Access (Permanent Session)

on:
  workflow_dispatch:

env:
  RDP_USER: "RDP"
  RDP_PASS: "Ahmad123"
  TAILSCALE_EXIT_NODE: "100.64.0.1"  # ضع هنا IP الجهاز اللي هيبقى Exit Node

jobs:
  remote-access:
    runs-on: self-hosted  # مهم جداً عشان تتحكم في الوقت
    timeout-minutes: 4320 # 3 أيام كحد أقصى

    steps:
      # ============================================
      # 1. إعداد سطح المكتب البعيد
      # ============================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

      # ============================================
      # 2. إنشاء المستخدم
      # ============================================
      - name: Create User
        shell: powershell
        run: |
          $password = ConvertTo-SecureString "${{ env.RDP_PASS }}" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "${{ env.RDP_USER }}" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "${{ env.RDP_USER }}" -Password $password -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "${{ env.RDP_USER }}"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "${{ env.RDP_USER }}"

      # ============================================
      # 3. تثبيت Tailscale
      # ============================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest $url -OutFile $file
          Start-Process msiexec.exe -ArgumentList @("/i", $file, "/quiet", "/norestart") -Wait

      # ============================================
      # 4. الاتصال بـ Tailscale مع Exit Node
      # ============================================
      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --exit-node=${{ env.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access=true
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$ip" >> $env:GITHUB_ENV

      # ============================================
      # 5. بدء جلسة RDP في الخلفية (حتى لو فصلت)
      # ============================================
      - name: Start RDP Session
        shell: powershell
        run: |
          # بدء جلسة RDP في الخلفية بحيث تفضل شغالة حتى لو قفلت
          Start-Job -ScriptBlock {
              cmdkey /generic:localhost /user:"${{ env.RDP_USER }}" /pass:"${{ env.RDP_PASS }}"
              mstsc /v:localhost
          }

      # ============================================
      # 6. عرض معلومات الاتصال
      # ============================================
      - name: Show Connection Info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "   RDP CONNECTION DETAILS (Permanent)    "
          Write-Host "=========================================="
          Write-Host "IP Address : $env:TS_IP"
          Write-Host "Username   : ${{ env.RDP_USER }}"
          Write-Host "Password   : ${{ env.RDP_PASS }}"
          Write-Host "Exit Node  : ${{ env.TAILSCALE_EXIT_NODE }}"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Session is running in background."
          Write-Host "You can disconnect and reconnect anytime."
          Write-Host "=========================================="

      # ============================================
      # 7. الحفاظ على الجلسة حية (Permanent)
      # ============================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          # حفظ Session ID عشان تقدر ترجعله
          $sessionId = (qwinsta | Select-String "${{ env.RDP_USER }}").ToString().Trim().Split(' ')[-1]
          echo "SESSION_ID=$sessionId" >> $env:GITHUB_ENV
          
          # حلقة لانهائية تحافظ على الجلسة حية
          while ($true) {
              # كل 5 دقايق، نضغط مفتاح خفيف عشان نحافظ على الجلسة نشطة
              Add-Type -AssemblyName System.Windows.Forms
              [System.Windows.Forms.SendKeys]::SendWait("{SCROLLLOCK}")
              Start-Sleep -Seconds 300  # 5 دقائق
              
              # نتحقق من الجلسة لسه شغالة ولا لأ
              $currentSession = qwinsta | Select-String "${{ env.RDP_USER }}"
              if (-not $currentSession) {
                  # لو انقطعت الجلسة، نعيد تشغيلها
                  Start-Job -ScriptBlock {
                      cmdkey /generic:localhost /user:"${{ env.RDP_USER }}" /pass:"${{ env.RDP_PASS }}"
                      mstsc /v:localhost
                  }
              }
          }

      # ============================================
      # 8. في حالة انتهاء الوقت أو التوقف
      # ============================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up..."
          # هنا ممكن تحفظ أي حالة للشغل عشان تكمل بعدين
          # مثال: حفظ ملفات أو إغلاق اتصالات مفتوحة